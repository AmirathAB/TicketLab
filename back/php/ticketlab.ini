; Limites PHP pour TicketLab en developpement.
;
; Le php.ini systeme (/etc/php/8.2/cli/php.ini) limite post_max_size a 8M et
; upload_max_filesize a 2M. Or config/ticketlab.php autorise un template perso
; de 10 Mo (template_max_mb) et un ZIP de QR de 50 Mo (qr_zip_max_mb) : tout
; upload au-dela de 2 Mo etait donc tronque silencieusement par PHP, AVANT que
; Laravel ne voie la requete. Le navigateur recevait alors une reponse
; inexploitable (net::ERR_FAILED) au lieu d'un message d'erreur utilisable.
;
; D'ou l'erreur "Impossible de joindre le serveur" sur POST /api/generate/*.
;
; A charger explicitement, le fichier systeme n'etant pas modifie :
;   php -c php/ticketlab.ini artisan serve
;
; En production, ces valeurs doivent aussi etre fixees dans le php.ini du
; serveur web (FPM/Nginx/Apache) : le fichier ci-dessous n'est lu que par le
; serveur integre de PHP utilise en developpement.

; Doit toujours depasser upload_max_filesize, sinon les fichiers uploades sont
; tronques avant d'atteindre post_max_size.
post_max_size = 64M
upload_max_filesize = 64M

; Le rendu GD travaille sur des images de 2362x2362 (Lavage) voire 4188x2713
; (Parking) en truecolor : 8 Mo sont insuffisants pour une serie.
memory_limit = 512M

; Une generation de plusieurs centaines de tickets peut depasser 30 s.
max_execution_time = 300

; PHP_CLI_SERVER_WORKERS n'est PAS une directive ini mais une variable
; d'environnement lue par le serveur integre. Elle est donc passee via -d :
;   PHP_CLI_SERVER_WORKERS=4 php -c php/ticketlab.ini artisan serve
; (voir back/README ou la commande de demarrage).